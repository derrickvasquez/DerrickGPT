<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DerrickGPT</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importing Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styling for neon green */
        .neon-text {
            color: #39FF14; /* Neon Green */
        }

        /* Apply Inter font for header and user input */
        .inter-font {
            font-family: 'Inter', sans-serif;
        }

        /* Coding-style font for model response */
        .coding-font {
            font-family: 'Courier New', monospace;
        }

        /* Add margin between user and model messages */
        .message {
            margin-bottom: 1rem; /* Space between messages */
        }

        /* User Input style */
        .user-input {
            color: white; /* White text for user input */
        }

        /* Model response style */
        .model-response {
            color: #39FF14; /* Neon Green for the model response */
            text-shadow: none; /* No text shadow */
        }

        /* Style for the buttons container */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        /* Footer styles */
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #050d33;
            color: #d3d3d3; /* Light gray color */
            width: 100%;
            font-size: 0.805rem; /* Smaller font size */
        }

        footer a {
            color: #39FF14;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Chatbox Scroll */
        #chatbox {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-[#050d33] text-white flex items-center justify-center min-h-screen">

    <!-- Main Container to manage layout -->
    <div class="w-full max-w-5xl mx-auto p-5 flex flex-col items-center space-y-5">
        <!-- Header -->
        <header class="text-center py-5">
            <h1 class="text-4xl sm:text-5xl font-bold neon-text inter-font">DerrickGPT</h1>
        </header>

        <!-- Chatbox -->
        <div id="chatbox" class="bg-[#050d33] rounded-xl p-5 h-96 overflow-y-auto text-lg sm:text-xl w-full max-w-5xl">
            <!-- Chat history will appear here -->
        </div>

        <!-- User Input -->
        <div class="w-full max-w-5xl flex flex-col sm:flex-row gap-5 items-center">
            <input type="text" id="userInput" placeholder="Type your message..." class="flex-1 p-3 rounded-lg text-xl sm:text-2xl text-white bg-[#050d33] border-2 border-[#f1f1f1] focus:outline-none inter-font">
            
            <!-- Button container aligned to the right -->
            <div class="button-container mt-3 sm:mt-0">
                <button id="sendBtn" class="px-6 py-3 bg-blue-600 rounded-lg text-white text-lg sm:text-xl w-full">Send</button>
                <button id="pauseBtn" class="px-6 py-3 bg-red-600 rounded-lg text-white text-lg sm:text-xl w-full">Pause</button>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Created by <a href="https://www.derrickvasquez.com" target="_blank">Derrick Vasquez</a>, powered by OpenAI technology</p>
            <p>
                DerrickGPT can make mistakes. Check Important info.
            </p>
        </footer>
    </div>

    <!-- Script to Handle the Chatbot Interaction -->
    <script>
        // Get references to HTML elements
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        // Typing effect variables
        let typingIndex = 0;
        let typingInterval;
        let isPaused = false;
        let currentText = ''; // To store the current text for resuming
        let currentDiv = null; // To store the current div element being typed into

        // Function to simulate typing effect
        function typeEffect(text, element, speed = 20) {
            currentText = text; // Store the current text being typed
            typingIndex = 0; // Reset the typing index
            currentDiv = element; // Store the current div element

            typingInterval = setInterval(() => {
                if (isPaused) {
                    clearInterval(typingInterval); // Stop the typing effect if paused
                    return;
                }
                // Add character by character to the element
                if (typingIndex < text.length) {
                    element.innerHTML += text[typingIndex];
                    typingIndex++;
                } else {
                    clearInterval(typingInterval); // Stop typing when it's finished
                    chatbox.scrollTop = chatbox.scrollHeight; // Scroll to the bottom
                }
            }, speed);
        }

        // Function to add message to chatbox
        function addMessage(sender, message, isModel = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message'); // Add margin between messages
            messageDiv.classList.add(sender === 'You' ? 'user-input' : 'model-response'); // White for user input, neon green for model response
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatbox.appendChild(messageDiv);
            chatbox.scrollTop = chatbox.scrollHeight; // Auto scroll to latest message
        }

        // Function to send a message to the backend and get a response
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Display the user's message
            addMessage('You', message);

            userInput.value = ''; // Clear input

            // Show the typing effect for the model's response
            const responseDiv = document.createElement('div');
            responseDiv.classList.add('coding-font', 'model-response'); // Model response in neon green and coding style
            responseDiv.innerHTML = "<strong>DerrickGPT:</strong> "; // Always show the label immediately
            chatbox.appendChild(responseDiv);
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                // Make a POST request to the backend to get the model's response
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();

                // Start the typing effect and display the actual response
                const responseText = data.response; // The model's response
                typeEffect(responseText, responseDiv, 70);  // Start typing effect on model response
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Add event listener to the send button
        sendBtn.addEventListener('click', sendMessage);

        // Allow the user to send the message by pressing Enter key
        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Pause/Resume the typing effect
        pauseBtn.addEventListener('click', function() {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? "Resume" : "Pause"; // Toggle button text
            if (!isPaused && currentDiv) {
                // Resume typing effect from where it left off
                typeEffect(currentText.slice(typingIndex), currentDiv, 70); // Resume from where it left off
            }
        });
    </script>

</body>
</html>
